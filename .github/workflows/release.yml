name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux build is wired up but commented out until the Linux port is
          # validated. Uncomment when ready and add "deb"/"appimage" to
          # tauri.conf.json bundle.targets.
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential curl wget file

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Stage portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($tag) -or -not $tag.StartsWith("v")) { $tag = "dev" }
          $srcDir = "src-tauri/target/${{ matrix.target }}/release"
          if (-not (Test-Path "$srcDir/markview.exe")) {
            $srcDir = "src-tauri/target/release"
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "$srcDir/markview.exe" "dist/Markview-$tag-portable.exe" -Force
          Get-ChildItem dist

      - name: Upload portable exe artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markview-portable-windows
          path: dist/*.exe

      - name: Upload installer artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markview-installer-windows
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Attach portable exe to GitHub Release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
